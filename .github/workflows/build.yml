name: Build

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repository
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The newest .NET 10 SDK; global.json only sets the floor (any .NET 10 SDK, including Linux distribution
          # packages, which ship the 10.0.1xx series). Package versions are locked, so builds stay reproducible.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.Common.sln --locked-mode

      - name: Build
        run: dotnet build Jellyfin.Plugin.Common.sln --configuration Release --no-restore

      - name: Test
        id: test
        shell: bash
        run: |
          set -o pipefail
          dotnet test --solution Jellyfin.Plugin.Common.sln --configuration Release --no-build 2>&1 | tee test-output.log

      - name: Annotate failed tests
        if: failure() && steps.test.outcome == 'failure'
        shell: python
        run: |
          # Surface the end of the test output as an annotation (readable on the PR without opening logs)
          tail = open("test-output.log", encoding="utf-8", errors="replace").read().splitlines()[-60:]
          body = "%0A".join(l.replace("%", "%25").replace("\r", "") for l in tail)
          print(f"::error title=dotnet test failed (last lines of output)::{body}")
